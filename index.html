<!DOCTYPE html>

<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>LISTED</title>
<meta name="theme-color" content="#060606">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;background:#060606;color:#F0EDE8;font-family:'DM Sans',sans-serif}
input,select{background:#111!important;color:#F0EDE8!important;-webkit-text-fill-color:#F0EDE8!important;-webkit-appearance:none;border:1px solid #2A2A2A!important;border-radius:2px}
input::placeholder{color:#444!important;-webkit-text-fill-color:#444!important}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 1000px #111 inset!important;-webkit-text-fill-color:#F0EDE8!important}
.nav{background:rgba(6,6,6,.97);border-bottom:1px solid #1C1C1C;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:50}
.nav-logo{height:28px;width:auto;object-fit:contain;vertical-align:middle}
.nb{font-family:'Space Mono',monospace;font-size:8px;color:#666;background:none;border:1px solid #2A2A2A;padding:6px 12px;border-radius:2px;cursor:pointer;letter-spacing:1px;-webkit-appearance:none}
.nb:active{opacity:.5;transform:scale(.93)}
.btn{display:block;width:100%;background:#F0EDE8;color:#060606;border:none;border-radius:2px;padding:14px;font-family:'Space Mono',monospace;font-weight:700;font-size:12px;letter-spacing:2px;cursor:pointer;-webkit-appearance:none;text-align:center}
.btn:active{opacity:.65;transform:scale(.97)}
.btn:disabled{background:#2A2A2A;color:#666}
/* EVENT CARDS */
.ec{display:flex;align-items:stretch;border-bottom:1px solid #111;cursor:pointer;min-height:90px}
.ec:active{background:#0d0d0d}
.ec-ln{width:3px;flex-shrink:0}
.ec-th{width:64px;flex-shrink:0;background:#0a0a0a;margin:10px 0 10px 10px;border-radius:2px;overflow:hidden;align-self:center}
.ec-th img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.ec-ph{width:64px;height:80px;display:flex;align-items:center;justify-content:center;font-size:22px}
.ec-bd{flex:1;padding:12px 14px 12px 12px;min-width:0;display:flex;flex-direction:column;gap:2px;justify-content:center}
.ec-dt{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:2px}
.ec-nm{font-family:'Space Mono',monospace;font-weight:900;font-size:18px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-sb{font-size:11px;color:#555;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ec-gr{font-family:'Space Mono',monospace;font-size:6px;color:#666;letter-spacing:1px}
.ec-venue{font-family:'Space Mono',monospace;font-size:7px;color:#888;letter-spacing:1px;margin-top:3px;display:flex;align-items:center;gap:4px}
.ec-ft{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
.ec-tm{font-family:'Space Mono',monospace;font-size:8px;opacity:.5}
.ec-btn{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:#000;border:none;border-radius:2px;padding:7px 14px;cursor:pointer;-webkit-appearance:none}
.ec-btn:active{opacity:.7;transform:scale(.92)}
/* RES PANEL */
.rp{max-height:0;overflow:hidden;transition:max-height .32s ease;background:#070707;border-bottom:1px solid #2A2A2A}
.rp.op{max-height:900px}
.rp-in{padding:16px}
.flbl{font-family:'Space Mono',monospace;font-size:8px;color:#666;letter-spacing:2px;margin-bottom:6px;display:block;margin-top:2px}
.fi{width:100%;background:#111;border:1px solid #2A2A2A;border-radius:2px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:16px;outline:none;color:#F0EDE8;-webkit-text-fill-color:#F0EDE8;-webkit-appearance:none;display:block;margin-bottom:12px}
.fi:focus{border-color:#888!important}
.fi::placeholder{color:#444;-webkit-text-fill-color:#444}
.ph-row{display:flex;gap:6px;margin-bottom:12px}
.ph-cc{width:90px;flex-shrink:0;background:#111;border:1px solid #2A2A2A;border-radius:2px;padding:13px 10px;font-family:'DM Sans',sans-serif;font-size:14px;color:#F0EDE8;-webkit-appearance:none;outline:none}
.ph-nm{flex:1;background:#111;border:1px solid #2A2A2A;border-radius:2px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:16px;outline:none;color:#F0EDE8;-webkit-appearance:none}
.ph-nm::placeholder{color:#444;-webkit-text-fill-color:#444}
.cnt-row{display:flex;align-items:center;background:#111;border:1px solid #2A2A2A;border-radius:2px;overflow:hidden;margin-bottom:12px}
.cnt-b{width:52px;height:52px;background:none;border:none;color:#F0EDE8;font-size:24px;cursor:pointer;-webkit-appearance:none}
.cnt-b:active{background:#1C1C1C}
.cnt-v{flex:1;text-align:center;font-family:'Space Mono',monospace;font-size:26px;font-weight:700}
.gnote{background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.15);border-left:3px solid #C9A84C;border-radius:2px;padding:10px 14px;margin-bottom:12px;font-family:'Space Mono',monospace;font-size:9px;color:#C9A84C;line-height:1.8}
.rules{background:#060f14;border:1px solid #0d2035;border-left:3px solid #2E6DA4;border-radius:2px;padding:14px;margin-bottom:12px}
.rules-t{font-family:'Space Mono',monospace;font-size:9px;color:#6899bb;line-height:2;margin-bottom:10px;white-space:pre-line}
.rules-c{display:flex;align-items:flex-start;gap:10px;cursor:pointer;border-top:1px solid #0d2035;padding-top:10px}
.rules-c input{width:18px;height:18px;accent-color:#2E6DA4;cursor:pointer;flex-shrink:0;margin-top:1px;margin-bottom:0}
.rules-c span{font-family:'Space Mono',monospace;font-size:9px;color:#6899bb;line-height:1.7}
/* DISCOVERY */
.disc-hero{padding:24px 16px 16px}
.disc-ttl{font-family:'Space Mono',monospace;font-weight:900;font-size:28px;letter-spacing:4px;margin-bottom:4px}
.disc-sub{font-family:'Space Mono',monospace;font-size:8px;color:#444;letter-spacing:2px;margin-bottom:16px}
.filter-row{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 4px}
.filter-row::-webkit-scrollbar{display:none}
.fchip{font-family:'Space Mono',monospace;font-size:7px;padding:6px 12px;border-radius:2px;cursor:pointer;border:1px solid #2A2A2A;color:#666;background:none;letter-spacing:1.5px;white-space:nowrap;flex-shrink:0;-webkit-appearance:none}
.fchip:active{transform:scale(.92);opacity:.7}
.fchip.on{color:#060606;border-color:#F0EDE8;background:#F0EDE8}
.sec-ttl{font-family:'Space Mono',monospace;font-weight:700;font-size:10px;letter-spacing:3px;color:#444;padding:16px 16px 10px;border-top:1px solid #1C1C1C}
/* VENUE CARDS (discovery) */
.vc{background:#111;border:1px solid #1C1C1C;border-radius:2px;margin:0 16px 8px;overflow:hidden;cursor:pointer}
.vc:active{background:#1a1a1a}
.vc-inner{display:flex;align-items:center;gap:12px;padding:14px}
.vc-logo{width:44px;height:44px;border-radius:2px;background:#0a0a0a;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px}
.vc-logo img{width:100%;height:100%;object-fit:contain}
.vc-info{flex:1;min-width:0}
.vc-name{font-family:'Space Mono',monospace;font-weight:700;font-size:14px;letter-spacing:2px;line-height:1}
.vc-meta{font-family:'Space Mono',monospace;font-size:7px;color:#666;letter-spacing:1px;margin-top:4px}
.vc-go{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:1px;color:#666;padding:6px 12px;border:1px solid #2A2A2A;border-radius:2px;background:none;cursor:pointer;white-space:nowrap;-webkit-appearance:none;flex-shrink:0}
.vc-go:active{color:#F0EDE8;border-color:#666}
/* VENUE MODE */
.venue-header{padding:16px;border-bottom:1px solid #1C1C1C;display:flex;align-items:center;gap:12px}
.venue-logo-lg{width:52px;height:52px;border-radius:4px;background:#0a0a0a;flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px}
.venue-logo-lg img{width:100%;height:100%;object-fit:contain}
.venue-name-lg{font-family:'Space Mono',monospace;font-weight:700;font-size:18px;letter-spacing:3px;line-height:1}
.venue-tagline{font-family:'Space Mono',monospace;font-size:8px;color:#666;letter-spacing:2px;margin-top:4px}
.venue-city{font-family:'Space Mono',monospace;font-size:7px;color:#444;letter-spacing:1px;margin-top:3px}
/* MISC */
.ev-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 12px;border-bottom:1px solid #1C1C1C}
.ev-ttl{font-family:'Space Mono',monospace;font-weight:900;font-size:14px;letter-spacing:3px}
.empty{text-align:center;padding:60px 20px;font-family:'Space Mono',monospace;font-size:8px;color:#666;letter-spacing:1px;line-height:3}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#F0EDE8;color:#060606;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;padding:10px 20px;border-radius:2px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.8)}
.toast.on{opacity:1}
</style>
</head>
<body>

<!-- NAV -->

<div class="nav" id="main-nav">
  <div id="nav-content" style="display:flex;align-items:center;gap:10px;flex:1">
    <span style="font-family:'Space Mono',monospace;font-weight:900;font-size:16px;letter-spacing:5px" id="nav-brand">LISTED</span>
  </div>
  <button class="nb" id="nav-btn" onclick="navBtnClick()">YÖNETİM</button>
</div>

<div id="ann-bar" style="display:none;border-bottom:1px solid rgba(201,168,76,.15);padding:8px 16px;font-family:Space Mono,monospace;font-size:9px;letter-spacing:1px;text-align:center;background:rgba(201,168,76,.08);color:#C9A84C"></div>

<div id="main-content"></div>

<div style="padding-bottom:60px"></div>
<div class="toast" id="toast-el"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
var SB  = 'https://ilybetbphzzgotruiegm.supabase.co';
var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlseWJldGJwaHp6Z290cnVpZWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzUxNDQ5OTEsImV4cCI6MjA5MDcyMDk5MX0.REb1XLJdDMxS_TrJgUoVpFI8qe8XZB7fqBxIfX3AYSg';

var SLUG  = new URLSearchParams(location.search).get('v'); // null = discovery mode
var IS_DISC = !SLUG;

var venue  = null;
var events = [];
var allVenues = [];
var counts = {};
var discCat = '';
var discCity = '';

// ── UTILS ────────────────────────────────────────────────────────
function ge(id){ return document.getElementById(id); }
function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function rnd(n){ var r=''; for(var i=0;i<n;i++)r+='0123456789abcdef'[Math.floor(Math.random()*16)]; return r; }
function toast(m){ var t=ge('toast-el'); t.textContent=m; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('on');},2800); }
function gc(g){ if(!g)return'#888'; g=g.toLowerCase(); if(g.includes('techno'))return'#E8302F'; if(g.includes('house'))return'#E0A030'; if(g.includes('deep'))return'#4A7FE0'; if(g.includes('acid'))return'#9B59B6'; if(g.includes('ambient'))return'#00C9A7'; if(g.includes('dnb')||g.includes('drum'))return'#E06030'; if(g.includes('jazz')||g.includes('canli')||g.includes('live'))return'#4ECDC4'; return'#888'; }
function fmtD(s){ if(!s)return''; try{ var d=new Date(s+'T12:00:00'); return ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()]+' '+d.getDate()+' '+['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()]; }catch(e){return s;} }
function cdStr(s){ var t=new Date(); t.setHours(0,0,0,0); var d=Math.round((new Date(s+'T12:00:00')-t)/864e5); if(d===0)return' · TODAY'; if(d===1)return' · TOMORROW'; if(d>1&&d<=14)return' · '+d+'D'; return''; }
function navBtnClick(){ location.href='admin.html'+(SLUG?'?v='+SLUG:''); }

// ── FETCH ────────────────────────────────────────────────────────
function sbGet(path){
  return new Promise(function(resolve){
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ ctrl.abort(); resolve([]); }, 8000);
    fetch(SB+'/rest/v1/'+path, { headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}, signal:ctrl.signal })
      .then(function(r){ return r.json(); })
      .then(function(d){ clearTimeout(timer); resolve(Array.isArray(d)?d:[]); })
      .catch(function(){ clearTimeout(timer); resolve([]); });
  });
}

function sbPost(table, data){
  return new Promise(function(resolve){
    fetch(SB+'/rest/v1/'+table, {
      method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=representation'},
      body:JSON.stringify(data)
    })
    .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,data:Array.isArray(d)?d[0]:d,code:d&&d.code}; }); })
    .then(resolve)
    .catch(function(e){ resolve({ok:false,data:null,code:null}); });
  });
}

// ── BOOT ─────────────────────────────────────────────────────────
(async function init(){
  if (IS_DISC) {
    renderDiscSkeleton();
    await loadDisc();
  } else {
    renderVenueSkeleton();
    await loadVenue();
  }
})();

// ── DISCOVERY MODE ───────────────────────────────────────────────
function renderDiscSkeleton(){
  ge('main-content').innerHTML =
    '<div class="disc-hero">'
    +'<div class="disc-ttl">LISTED</div>'
    +'<div class="disc-sub">TÜM MEKÂNLARDAN ETKİNLİKLER</div>'
    +'<div class="filter-row" id="city-filters"></div>'
    +'<div style="height:8px"></div>'
    +'<div class="filter-row" id="cat-filters">'
    +'<button class="fchip on" onclick="setDCat(this,\'\')">TÜMÜ</button>'
    +'</div>'
    +'</div>'
    +'<div class="ev-hd"><span class="ev-ttl">ETKİNLİKLER</span></div>'
    +'<div id="ev-list"></div>'
    +'<div class="sec-ttl">MEKÂNLAR</div>'
    +'<div id="venue-list"></div>';
}

async function loadDisc(){
  var today = new Date().toISOString().split('T')[0];
  var [evData, venueData, catData] = await Promise.all([
    sbGet('events?select=*&status=eq.active&date=gte.'+today+'&order=date.asc&limit=60'),
    sbGet('venues?select=id,name,slug,city,address,accent_color,logo_b64,tagline,settings&active=eq.true&order=name.asc'),
    sbGet('categories?select=*&active=eq.true&order=sort_order.asc')
  ]);
  events = evData;
  allVenues = venueData;
  // Build category filters from DB
  var cf2 = ge('cat-filters');
  if(cf2 && catData.length){
    var catHtml = '<button class="fchip on" onclick="setDCat(this,\'\')">TÜMÜ</button>';
    catData.forEach(function(c){
      catHtml += '<button class="fchip" onclick="setDCat(this,\''+c.slug+'\')">'+(c.icon||'')+' '+c.name.toUpperCase()+'</button>';
    });
    cf2.innerHTML = catHtml;
  }

  // Build city filter from venues
  var cities = [];
  allVenues.forEach(function(v){ if(v.city && cities.indexOf(v.city)<0) cities.push(v.city); });
  var cf = ge('city-filters');
  if(cf && cities.length > 1){
    var html = '<button class="fchip on" onclick="setDCity(this,\'\')">TÜM ŞEHİRLER</button>';
    cities.forEach(function(c){ html += '<button class="fchip" onclick="setDCity(this,\''+esc(c)+'\')">'+esc(c.toUpperCase())+'</button>'; });
    cf.innerHTML = html;
  }

  renderDiscEvents();
  renderVenueList();
}

function setDCat(el, cat){
  ge('cat-filters').querySelectorAll('.fchip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on'); discCat = cat; renderDiscEvents();
}
function setDCity(el, city){
  ge('city-filters').querySelectorAll('.fchip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on'); discCity = city; renderDiscEvents();
}

function renderDiscEvents(){
  var el = ge('ev-list'); if(!el) return;
  var filtered = events.filter(function(e){
    if(discCat && (e.category||'') !== discCat) return false;
    if(discCity){
      var v = allVenues.find(function(v){ return v.id===e.venue_id; });
      if(!v || v.city !== discCity) return false;
    }
    return true;
  });
  if(!filtered.length){ el.innerHTML='<div class="empty">Etkinlik bulunamadı.</div>'; return; }
  el.innerHTML='';
  filtered.forEach(function(e){
    var vInfo = allVenues.find(function(v){ return v.id===e.venue_id; });
    var color = e.color || gc(e.genre) || (vInfo&&vInfo.accent_color) || '#888';
    var card = makeEventCard(e, color, vInfo, true); // true = show venue info
    el.appendChild(card.card);
    el.appendChild(card.panel);
  });
}

function renderVenueList(){
  var el = ge('venue-list'); if(!el) return;
  if(!allVenues.length){ el.innerHTML='<div class="empty">Henüz kayıtlı mekân yok.</div>'; return; }
  el.innerHTML='';
  allVenues.forEach(function(v){
    var card = document.createElement('div'); card.className='vc';
    card.style.borderLeft = '3px solid '+(v.accent_color||'#888');
    var inner = document.createElement('div'); inner.className='vc-inner';
    var logo = document.createElement('div'); logo.className='vc-logo';
    if(v.logo_b64){ var img=document.createElement('img'); img.src=v.logo_b64; logo.appendChild(img); }
    else logo.textContent='🏛️';
    var info = document.createElement('div'); info.className='vc-info';
    var nm = document.createElement('div'); nm.className='vc-name'; nm.textContent=v.name;
    var meta = document.createElement('div'); meta.className='vc-meta';
    var parts = [];
    if(v.city) parts.push(v.city);
    if(v.address) parts.push(v.address);
    meta.textContent = parts.join(' · ') || '—';
    info.appendChild(nm); info.appendChild(meta);
    var goBtn = document.createElement('button'); goBtn.className='vc-go';
    goBtn.textContent='SAYFAYA GİT →';
    goBtn.style.borderColor = v.accent_color||'#2A2A2A';
    (function(slug){ goBtn.onclick=function(e){ e.stopPropagation(); location.href='?v='+slug; }; })(v.slug);
    inner.appendChild(logo); inner.appendChild(info); inner.appendChild(goBtn);
    card.appendChild(inner);
    card.onclick = function(){ location.href='?v='+v.slug; };
    el.appendChild(card);
  });

  // Add "join listed" card
  var join = document.createElement('div');
  join.style.cssText='background:#111;border:1px solid #1C1C1C;border-radius:2px;margin:0 16px 8px;padding:24px;text-align:center';
  join.innerHTML='<div style="font-family:Space Mono,monospace;font-size:11px;font-weight:700;letter-spacing:2px;margin-bottom:8px">MEKÂNINIZI EKLEYİN</div>'
    +'<div style="font-family:Space Mono,monospace;font-size:8px;color:#666;letter-spacing:1px;line-height:2;margin-bottom:16px">Kendi rezervasyon sisteminizi kurun.<br>Başvurunuz 24 saat içinde değerlendirilir.</div>'
    +'<a href="join.html" style="display:inline-block;font-family:Space Mono,monospace;font-size:10px;font-weight:700;color:#060606;background:#F0EDE8;padding:10px 20px;border-radius:2px;text-decoration:none;letter-spacing:2px">ÜCRETSİZ BAŞVUR →</a>';
  ge('venue-list').appendChild(join);
}

// ── VENUE MODE ───────────────────────────────────────────────────
function renderVenueSkeleton(){
  ge('main-content').innerHTML = '<div class="ev-hd"><span class="ev-ttl">ETKİNLİKLER</span></div><div id="ev-list"></div>';
}

async function loadVenue(){
  var [vd, evData] = await Promise.all([
    sbGet('venues?select=*&slug=eq.'+encodeURIComponent(SLUG)+'&limit=1'),
    (async function(){
      var today = new Date().toISOString().split('T')[0];
      var d = await sbGet('events?select=*&status=eq.active&date=gte.'+today+'&order=date.asc&limit=60');
      return d;
    })()
  ]);

  if(vd.length){
    venue = vd[0];
    applyVenueBrand(venue);
    // Load ann
    sbGet('settings?select=value&venue_id=eq.'+venue.id+'&key=eq.announcement&limit=1').then(function(ad){
      if(ad.length&&ad[0].value){ var ab=ge('ann-bar'); if(ab){ab.style.display='block';ab.textContent=ad[0].value;} }
    });
    // Filter events by venue
    events = evData.filter(function(e){ return e.venue_id===venue.id; });
    if(!events.length){
      // try without filter
      events = evData;
    }
  } else {
    events = evData;
  }

  renderVenueEvents();
}

function applyVenueBrand(v){
  document.title = v.name;

  // Venue header
  var content = ge('main-content');
  var hdr = document.createElement('div'); hdr.className='venue-header';
  var logoEl = document.createElement('div'); logoEl.className='venue-logo-lg';
  if(v.logo_b64){ var img=document.createElement('img'); img.src=v.logo_b64; logoEl.appendChild(img); }
  else logoEl.textContent='🏛️';
  var info = document.createElement('div'); info.style.flex='1';
  var nm = document.createElement('div'); nm.className='venue-name-lg'; nm.textContent=v.name;
  var tg = document.createElement('div'); tg.className='venue-tagline'; tg.textContent=v.tagline||'';
  var ct = document.createElement('div'); ct.className='venue-city';
  var cityParts = []; if(v.city)cityParts.push(v.city); if(v.address)cityParts.push(v.address);
  ct.textContent = cityParts.join(' · ');
  info.appendChild(nm); info.appendChild(tg); if(cityParts.length)info.appendChild(ct);
  hdr.appendChild(logoEl); hdr.appendChild(info);

  // Listed link
  var lnk = document.createElement('a'); lnk.href='./';
  lnk.style.cssText='font-family:Space Mono,monospace;font-size:7px;color:#444;letter-spacing:2px;text-decoration:none;display:block;text-align:center;padding:6px 0;border-bottom:1px solid #111';
  lnk.textContent='LISTED.ME';

  content.innerHTML='';
  content.appendChild(lnk);
  content.appendChild(hdr);

  var evHd = document.createElement('div'); evHd.className='ev-hd';
  var ttl = document.createElement('span'); ttl.className='ev-ttl'; ttl.textContent='ETKİNLİKLER';
  evHd.appendChild(ttl);
  content.appendChild(evHd);

  var evList = document.createElement('div'); evList.id='ev-list';
  content.appendChild(evList);

  // Apply colors
  if(v.bg_color){ document.body.style.background=v.bg_color; }
  if(v.accent_color){
    document.querySelector('.nav').style.borderBottomColor=v.accent_color+'33';
  }

  // Update nav - show venue name (no logo in nav for venue mode, logo is in header)
  var nb = ge('nav-brand'); if(nb) nb.textContent=v.name;
}

function renderVenueEvents(){
  var el = ge('ev-list'); if(!el) return;
  if(!events.length){ el.innerHTML='<div class="empty">Yaklaşan etkinlik yok.</div>'; return; }
  el.innerHTML='';
  events.forEach(function(e){
    var color = e.color || gc(e.genre) || (venue&&venue.accent_color) || '#888';
    var c = makeEventCard(e, color, venue, false);
    el.appendChild(c.card);
    el.appendChild(c.panel);
  });
}

// ── SHARED: EVENT CARD ───────────────────────────────────────────
function makeEventCard(e, color, vInfo, showVenue){
  var card = document.createElement('div'); card.className='ec'; card.dataset.eid=e.id;
  var ln=document.createElement('div'); ln.className='ec-ln'; ln.style.background=color;
  var th=document.createElement('div'); th.className='ec-th';
  if(e.poster_thumb){ var img=document.createElement('img'); img.src=e.poster_thumb; img.loading='lazy'; th.appendChild(img); }
  else{ var ph=document.createElement('div'); ph.className='ec-ph'; ph.textContent='🎵'; th.appendChild(ph); }
  var bd=document.createElement('div'); bd.className='ec-bd';
  var dtStr = fmtD(e.date)+cdStr(e.date);
  bd.innerHTML='<div class="ec-dt">'+esc(dtStr)+'</div>'
    +'<div class="ec-nm">'+esc(e.name)+'</div>'
    +(e.subtitle?'<div class="ec-sb">"'+esc(e.subtitle)+'"</div>':'')
    +'<div class="ec-gr">'+esc(e.genre||'')+'</div>';
  // Venue info on discovery
  if(showVenue && vInfo){
    var vLine=document.createElement('div'); vLine.className='ec-venue';
    vLine.innerHTML='📍 '+esc(vInfo.name)+(vInfo.city?' · '+esc(vInfo.city):'');
    bd.appendChild(vLine);
  }
  var ft=document.createElement('div'); ft.className='ec-ft';
  var tm=document.createElement('span'); tm.className='ec-tm'; tm.textContent=(e.time||'')+(e.time_end?' — '+e.time_end:'');
  var btn=document.createElement('button'); btn.className='ec-btn'; btn.textContent='RESERVE'; btn.style.background=color;
  (function(eid,col){ btn.onclick=function(ev){ ev.stopPropagation(); togglePanel(eid,col); }; })(e.id,color);
  ft.appendChild(tm); ft.appendChild(btn); bd.appendChild(ft);
  card.appendChild(ln); card.appendChild(th); card.appendChild(bd);
  card.addEventListener('click',function(){ togglePanel(e.id,color); });
  var rp=document.createElement('div'); rp.className='rp'; rp.id='rp-'+e.id;
  return {card:card, panel:rp};
}

// ── RESERVATION ──────────────────────────────────────────────────
function togglePanel(id, color){
  var e=events.find(function(x){return x.id===id;}); if(!e) return;
  document.querySelectorAll('.rp').forEach(function(p){ if(p.id!=='rp-'+id){p.classList.remove('op');p.innerHTML='';} });
  var p=ge('rp-'+id); if(!p) return;
  if(p.classList.contains('op')){ p.classList.remove('op'); p.innerHTML=''; return; }
  counts[id]=counts[id]||1;
  p.innerHTML=buildForm(e,id,color);
  p.classList.add('op');
  setTimeout(function(){ var c=document.querySelector('[data-eid="'+id+'"].ec'); if(c)c.scrollIntoView({behavior:'smooth',block:'start'}); },50);
}

function buildForm(e,id,color){
  // Table select
  var tblHtml='';
  var vData = IS_DISC ? allVenues.find(function(v){return v.id===e.venue_id;}) : venue;
  if(vData&&vData.settings&&vData.settings.tables_enabled){
    var tData=vData.settings.tables_data||(vData.settings.tables||[]).map(function(t){return{name:t};});
    if(tData.length){
      var zL={ic:'İç',dis:'Dış',teras:'Teras',vip:'VIP',bar:'Bar Önü',sahne:'Sahne Önü'};
      var opts=tData.map(function(t){
        var nm=typeof t==='string'?t:t.name;
        var parts=[]; if(typeof t==='object'){if(t.capacity)parts.push(t.capacity+' kişi');if(t.min_spend)parts.push('min ₺'+t.min_spend);if(t.zone&&zL[t.zone])parts.push(zL[t.zone]);}
        return '<option value="'+esc(nm)+'">'+esc(nm)+(parts.length?' ('+parts.join(', ')+')':'')+'</option>';
      }).join('');
      tblHtml='<label class="flbl">MASA SEÇ</label><select class="fi" id="rp-tbl-'+id+'"><option value="">-- Masa seçin (opsiyonel) --</option>'+opts+'</select>';
    }
  }
  // Rules
  var rulesHtml='';
  if(e.rules){ rulesHtml='<div class="rules"><div class="rules-t">'+esc(e.rules)+'</div><label class="rules-c"><input type="checkbox" id="rp-chk-'+id+'"><span>Kuralları okudum ve kabul ediyorum</span></label></div>'; }
  var ccOpts=['+90 TR','+7 RU','+1 US','+44 UK','+49 DE'].map(function(o){var p=o.split(' ')[0];return'<option value="'+p+'">'+o+'</option>';}).join('');
  return '<div class="rp-in" style="border-left:3px solid '+color+'">'
    +'<div class="gnote">Üye olmadan rezervasyon yapıyorsunuz.</div>'
    +'<label class="flbl">İSİM SOYİSİM</label>'
    +'<input class="fi" type="text" id="rp-nm-'+id+'" placeholder="Adınız" autocomplete="name">'
    +'<label class="flbl">TELEFON</label>'
    +'<div class="ph-row"><select class="ph-cc" id="rp-cc-'+id+'">'+ccOpts+'</select><input class="ph-nm" type="tel" id="rp-ph-'+id+'" placeholder="5xxxxxxxxx" inputmode="numeric" maxlength="15"></div>'
    +'<label class="flbl">KİŞİ SAYISI</label>'
    +'<div class="cnt-row"><button class="cnt-b" onclick="chgCnt(\''+id+'\',-1)">&#8722;</button><div class="cnt-v" id="rp-cnt-'+id+'">1</div><button class="cnt-b" onclick="chgCnt(\''+id+'\',1)">+</button></div>'
    +'<div id="rp-gs-'+id+'"></div>'
    +tblHtml+rulesHtml
    +'<button class="btn" id="rp-btn-'+id+'" onclick="submitRes(\''+id+'\')">REZERVASYON GÖNDER</button>'
    +'</div>';
}

function chgCnt(id,d){
  counts[id]=Math.max(1,Math.min(20,(counts[id]||1)+d));
  var cv=ge('rp-cnt-'+id); if(cv)cv.textContent=counts[id];
  var wrap=ge('rp-gs-'+id); if(!wrap)return; wrap.innerHTML='';
  for(var i=1;i<counts[id];i++){
    var div=document.createElement('div');
    div.innerHTML='<label class="flbl">'+i+'. MİSAFİR</label><input class="fi" type="text" id="rp-g'+i+'-'+id+'" placeholder="'+i+'. misafir ismi">';
    wrap.appendChild(div);
  }
}

async function submitRes(id){
  var e=events.find(function(x){return x.id===id;}); if(!e)return;
  var nm=((ge('rp-nm-'+id)||{}).value||'').trim();
  var cc=(ge('rp-cc-'+id)||{}).value||'+90';
  var ph=((ge('rp-ph-'+id)||{}).value||'').trim();
  var phone=ph?(cc+ph):'';
  if(!nm){toast('İsim zorunludur');return;}
  if(!phone){toast('Telefon zorunludur');return;}
  var count=counts[id]||1;
  var chk=ge('rp-chk-'+id);
  if(e.rules&&chk&&!chk.checked){toast('Lütfen kuralları onaylayın');return;}
  var tSel=ge('rp-tbl-'+id); var tName=tSel?tSel.value:'';
  var gNames=[];
  for(var gi=1;gi<count;gi++){
    var gInp=ge('rp-g'+gi+'-'+id);
    if(gInp){var gv=gInp.value.trim();if(!gv){toast(gi+'. misafirin adını girin');return;}gNames.push(gv);}
  }
  var btn=ge('rp-btn-'+id); if(btn){btn.disabled=true;btn.textContent='...';}
  var vId = e.venue_id || (venue&&venue.id) || null;
  var body={
    qr_id:'LST-'+rnd(8).toUpperCase(),
    event_id:id, event_name:e.name, event_date:e.date, event_time:e.time||'',
    name:nm, phone:phone, guest_count:count, guest_names:gNames,
    status:'pending', rules_accepted:!!(chk&&chk.checked)
  };
  if(tName)body.table_name=tName;
  if(vId)body.venue_id=vId;
  var r=await sbPost('reservations',body);
  if(btn){btn.disabled=false;btn.textContent='REZERVASYON GÖNDER';}
  if(!r.ok){
    if(r.code==='23505')toast('Bu etkinliğe zaten kayıt yaptırdınız');
    else toast('Bir hata oluştu, tekrar deneyin');
    return;
  }
  toast('Rezervasyon talebiniz alındı!');
  var p=ge('rp-'+id); if(p){p.classList.remove('op');setTimeout(function(){p.innerHTML='';},400);}
  counts[id]=1;
}
</script>
